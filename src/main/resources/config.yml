# World name
nether-world: world_nether
underworld-world: underworld

# Create the Underworld automatically on startup if it does not exist.
# Turn this off if you create it yourself with Multiverse.
auto-create-world: true

# Fog / atmosphere.
# fog-biome decides the fog colour (needs NEW chunks, see README):
#   soul_sand_valley = teal-green   warped_forest = purple-teal
#   nether_wastes    = red          crimson_forest = dark red   basalt_deltas = grey
fog-biome: soul_sand_valley
# Fixed time in the Underworld. Lower = brighter fog (12000 = dusk), higher = darker (14000+).
world-time: 13000

# Mobs
allow-mobs: false     # false = no mobs spawn in the Underworld at all
guard-mobs: false     # true = geared wither skeletons guard fortresses/towers/mazes

fall:
  # Falling below this Y in the Nether sends you down
  trigger-y: -8
  # Where you appear in the Underworld (keep under 320 so Bedrock can render it)
  arrival-y: 280
  slow-fall-seconds: 8
  # No fall damage for this long after arriving
  fall-immunity-seconds: 40

return:
  # Flying above this Y in the Underworld sends you back to the Nether
  trigger-y: 312
  fire-resistance-seconds: 15

guards:
  # Only used when guard-mobs is true
  respawn-minutes: 10
  fortress: 6
  tower: 3
  maze: 3
