name: Underworld
version: 1.0.0
main: dev.underworld.UnderworldPlugin
api-version: '1.21'
description: A no-build dimension far below the Nether void (Unstable SMP style).
softdepend: [Multiverse-Core, floodgate, Geyser-Spigot, Citizens]
commands:
  underworld:
    description: Underworld command
    usage: /underworld <journal|balance|locate|biome|info|tp|reload>
    aliases: [uw]
permissions:
  underworld.admin:
    description: Teleport to the Underworld, reload, and use locate ... tp
    default: op
  underworld.locate:
    description: Use /underworld locate and /underworld biome
    default: op
  underworld.bypass:
    description: Build and break inside the Underworld
    default: op
